<!doctype html>
<html>
    <head>
        <title>*pat pat pat*</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="icon" href="neocat_pat_floof.png" />
        <style>
            html, body {
                height: 100%;
                margin: 0;
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #112;
            }

            button {
                width: 360px;
                height: 360px;
                background: transparent;
                padding: 0;
                margin: 0;
                border: 0;
                position: relative;
                cursor: pointer;
                overflow: hidden;
            }

            img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                transform-origin: center;
            }

            #floof,
            button:not(:active):hover #plead,
            button:active #pets,
            button:focus:active #pets {
                opacity: 1;
            }

            button:not(:active):hover #floof,
            button:active #floof,
            button:active #plead {
                opacity: 0;
            }
        </style>
    </head>
    <body>
        <div>
            <button type="button">
                <img id="floof" src="neocat_floof.png" />
                <img id="plead" src="neocat_pleading_floof.png" />
                <img id="pets" src="neocat_pat_floof.png" />
            </button>
        </div>
    </body>
</html>
